- name: shell vs command
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: Test Command module
    # command: cat /etc/passwd | grep ec2-user
    shell: cat /etc/passwd | grep ec2-user

    register: ec2_user_output

  - name: Print ec2_user_output
    debug:
      msg: "{{ ec2_user_output }}"

  - name: redirect log files
    # command: ls -la >> /tmp/file.txt
    shell: ls -la >> /tmp/file.txt
    register: log_file_output

  - name: Print log_file_output
    debug: 
      msg: "{{log_file_output}}"