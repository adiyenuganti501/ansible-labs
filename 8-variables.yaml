- name: Variables from Prompt
  hosts: local
  connection: local

  vars_prompt:
    - name: username
      prompt: "Please enter username"
      private: false

    - name: password
      prompt: "Please enter password"
      private: true

  tasks:
    - name: Print Username and Password
      ansible.builtin.debug:
        msg: "The username is {{ username }} and password is {{ password }}"

