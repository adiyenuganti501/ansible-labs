- name: Loop Packages
  hosts: local
  connection: local
  become: yes
  vars:
   packages:
   - { name: 'nginx', state : 'absent' }
   - { name: 'git' , state : 'absent' }
   - { name: 'mysql', state: 'present' }
   - { name: 'net-tools', state: 'absent' }
   - { name: 'htop', state: 'present' }
  tasks:
  - name: Install All the packages
    package:
     name: "{{item.name}}"
     state: "{item.state}"
    loop: "{{packages}}"
