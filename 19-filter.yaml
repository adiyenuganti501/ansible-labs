- name: Ansible Filters
  hosts: local
  connection: local
  become: yes
  vars:
    topics: linux, shell, ansible, terraform, docker, AWS, k8s
    names:
    - Khiranya
    - Srini
    - Yenuganti
    topic: TERRAFORM 
    duration: "4"
 
  tasks:
    - name: Print name
      debug:
        msg: "Hi {{ person_name | default('Khiranya') }}"

    - name: Convert strig to list
      debug:
        msg: "Topics are: {{ topics | split(',') | trim }}"
    
    - name: List to string join
      debug:
        msg: "Get full name {{ names | join(' ') }}"

    - name: Convert to lower-case
      debug: 
        msg: "toipc :  {{ topic | lower }}"

    - name: Convert string to list
      debug:
        msg: "{{duration}} Hrs"


