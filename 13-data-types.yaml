- name: Ansible Data Typs
  hosts: local
  connection: local
  vars:
   cource: "DevOps ith AIOps and DevSecOps on AWS"
   duration: 4 months
   is_live_session: true
   topics: 
    - linux
    - shell
    - ansible
    - terraform 
   more_details: 
      trainer: siva
      time: 7:15 AM
   exat_duration_per_topic_in_weeks:  2
  

  tasks:
  - name: Print cource details
    debug:
      msg: |
        name: "{{cource}} : {{cource | type_debug}}
        duration: "{{duration}} : {{duration | type_debug}}"
        is live session: "{{is_live_session}} : {{is_live_session | type_debug}}"
        topics are: "{{topics}}: {{topics | type_debug}}"
        more deatils: "{{more_details}}: {{more_details | type_debug }} "

