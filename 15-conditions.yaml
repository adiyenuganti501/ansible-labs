- name: Print OS is RedHat or nor
  hosts: loca
  connection: local
  tasks:
  - name: Print OS is RedHat
    debug:
     msg: "OS is RedHat"
    when: ansible_facts.os_family == "RedHat"

  - name: Print OS is not RedHat
    debug:
      msg:  "OS is not RedHat"
    when: ansible_facts.os_family != "RedHat"